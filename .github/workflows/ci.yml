name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in zcalusic/debian-trixie. The CI_IMAGE variable, unset on
# GitHub, swaps in another image for local runs with act: one with the
# packages below already installed (the install steps still run) and with
# Node, which act needs in the container to run actions/cache.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: ${{ vars.CI_IMAGE || 'zcalusic/debian-trixie' }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make

      - uses: actions/checkout@v7
        with:
          # git describe needs the full history and tags for the version.
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure
          # -Werror only here, not for configure's own feature tests.
          make -j "$(nproc)" install-strip CFLAGS="-g -O2 -Werror"

      - name: Check
        run: |
          dynomite -V
          dynomite -t -c conf/redis_single.yml

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

      - name: Distribution check
        run: make -j "$(nproc)" distcheck VERBOSE=1

  # The other compiler and a 32-bit build, so their warnings don't come back
  # unnoticed.
  clang:
    name: Build (clang)
    runs-on: ubuntu-latest
    container: ${{ vars.CI_IMAGE || 'zcalusic/debian-trixie' }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake clang git libc6-dev libssl-dev libyaml-dev make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure CC=clang
          make -j "$(nproc)" CFLAGS="-g -O2 -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

  i386:
    name: Build (i386)
    runs-on: ubuntu-latest
    # An i386 container can't run the actions' 64-bit Node, so build with
    # -m32 against the i386 libraries; the binaries run on the x86_64 runner.
    # The default seccomp profile of Docker on the ubuntu-26.04 runners
    # refuses socketcall(), which i386 glibc uses for socket() and
    # setsockopt().
    container:
      image: ${{ vars.CI_IMAGE || 'zcalusic/debian-trixie' }}
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc gcc-multilib git libssl-dev:i386 libyaml-dev:i386 \
            make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure CC="gcc -m32"
          make -j "$(nproc)" CFLAGS="-g -O2 -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

  # The functional tests in parallel parts, against each datastore backend:
  # the latest Valkey and Redis releases, built from pinned source tarballs,
  # and trixie's packages as the oldest versions tested. The asan job runs
  # the same parts against trixie's Valkey.
  test:
    name: Functional tests (${{ matrix.backend.name }}, ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      # Every job runs to the end, whichever fails.
      fail-fast: false
      matrix:
        backend:
          - name: Valkey 9.1.3
            url: https://github.com/valkey-io/valkey/archive/refs/tags/9.1.3.tar.gz
            sha256: 184e34ed2d9b51879b682b5b15205e2b9d677c60280e3cb453be8f520d04e293
            packages: ca-certificates curl
            server: /opt/backend/bin/valkey-server
          - name: Redis 8.10.3
            url: https://github.com/redis/redis/archive/refs/tags/8.10.3.tar.gz
            sha256: 85ae62e175cc76f638015fa18cb384b549b6808a765425d9e9d47466f69532ea
            packages: ca-certificates curl
            server: /opt/backend/bin/redis-server
          - name: Valkey trixie
            packages: valkey-server
            server: valkey-server
          - name: Redis trixie
            packages: redis-server
            server: redis-server
        part: [no_quorum, safe_quorum, each_safe_quorum, tls and seeds]
        include: &functional-parts
          - part: no_quorum
            tests: test/no_quorum_request.yaml
          - part: safe_quorum
            tests: test/safe_quorum_request.yaml
          - part: each_safe_quorum
            tests: test/each_safe_quorum_request.yaml
          - part: tls and seeds
            tests: test/tls_test.py test/seed_test.py
    container: ${{ vars.CI_IMAGE || 'zcalusic/debian-trixie' }}
    env:
      DYN_TEST_SERVER: ${{ matrix.backend.server }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make \
            openssl python3 python3-plumbum python3-redis \
            python3-requests python3-yaml ${{ matrix.backend.packages }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The builds take 1.5-3 min on GitHub's runners, so they're cached, per
      # tarball. act can run the cache action only in a CI_IMAGE with Node;
      # without one it builds every time.
      - name: Cache backend
        id: cache-backend
        if: matrix.backend.url && (!env.ACT || vars.CI_IMAGE)
        uses: actions/cache@v6
        with:
          path: /opt/backend
          key: backend-trixie-${{ matrix.backend.sha256 }}

      - name: Build backend
        if: matrix.backend.url && steps.cache-backend.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/backend.tar.gz "${{ matrix.backend.url }}"
          echo "${{ matrix.backend.sha256 }}  /tmp/backend.tar.gz" | sha256sum -c
          mkdir /tmp/backend
          tar -xzf /tmp/backend.tar.gz -C /tmp/backend --strip-components=1
          make -C /tmp/backend -j "$(nproc)" BUILD_TLS=no
          make -C /tmp/backend install PREFIX=/opt/backend

      - name: Run functional tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MAKEFLAGS="-j $(nproc)" test/run_tests.sh ${{ matrix.tests }}

      # On failure: the end of every node's log of the run that failed (the
      # newest test directory), and on GitHub all the logs as an artifact;
      # act can't run the upload action in this container.
      - name: Node logs
        if: failure()
        run: test/show_logs.sh

      - name: Upload node logs
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: logs ${{ matrix.backend.name }} ${{ matrix.part }}
          path: test_run.*/logs/
          retention-days: 7

  # AddressSanitizer and UndefinedBehaviorSanitizer over the unit and
  # functional tests. Leaks aren't checked: valgrind covers those, and the
  # functional tests kill their nodes. The harness doesn't keep dynomite's
  # stderr, so the reports go to files, checked at the end.
  asan:
    name: Sanitizers (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: *functional-parts
    container: ${{ vars.CI_IMAGE || 'zcalusic/debian-trixie' }}
    env:
      DYN_TEST_SERVER: valkey-server
      ASAN_OPTIONS: detect_leaks=0:log_path=/tmp/sanitizer/asan
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:log_path=/tmp/sanitizer/ubsan
      SANITIZER_CFLAGS: -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined
    steps:
      - name: Install dependencies
        run: |
          mkdir -p /tmp/sanitizer
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make \
            openssl python3 python3-plumbum python3-redis python3-requests \
            python3-yaml valkey-server

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure --enable-debug=log CFLAGS="$SANITIZER_CFLAGS"
          # -Werror only here, not for configure's own feature tests.
          make -j "$(nproc)" CFLAGS="$SANITIZER_CFLAGS -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="$SANITIZER_CFLAGS -Werror"

      - name: Functional tests
        run: test/run_tests.sh --no-rebuild ${{ matrix.tests }}

      - name: Node logs
        if: failure()
        run: test/show_logs.sh

      - name: Upload node logs
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: logs sanitizers ${{ matrix.part }}
          path: test_run.*/logs/
          retention-days: 7

      - name: Sanitizer reports
        if: always()
        run: |
          if [ -n "$(ls -A /tmp/sanitizer)" ]; then
            cat /tmp/sanitizer/*
            exit 1
          fi
          echo "no sanitizer reports"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: zcalusic/debian-trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make

      - uses: actions/checkout@v7
        with:
          # git describe needs the full history and tags for the version.
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure
          # -Werror only here, not for configure's own feature tests.
          make -j "$(nproc)" install-strip CFLAGS="-g -O2 -Werror"

      - name: Check
        run: |
          dynomite -V
          dynomite -t -c conf/redis_single.yml

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

      - name: Distribution check
        run: make -j "$(nproc)" distcheck VERBOSE=1

  # The other compiler and a 32-bit build, so their warnings don't come back
  # unnoticed.
  clang:
    name: Build (clang)
    runs-on: ubuntu-latest
    container: zcalusic/debian-trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake clang git libc6-dev libssl-dev libyaml-dev make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure CC=clang
          make -j "$(nproc)" CFLAGS="-g -O2 -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

  i386:
    name: Build (i386)
    runs-on: ubuntu-latest
    # An i386 container can't run the actions' 64-bit Node, so build with
    # -m32 against the i386 libraries; the binaries run on the x86_64 runner.
    # The default seccomp profile of Docker on the ubuntu-26.04 runners
    # refuses socketcall(), which i386 glibc uses for socket() and
    # setsockopt().
    container:
      image: zcalusic/debian-trixie
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc gcc-multilib git libssl-dev:i386 libyaml-dev:i386 \
            make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure CC="gcc -m32"
          make -j "$(nproc)" CFLAGS="-g -O2 -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="-g -O2 -Werror"

  # The functional tests in parallel parts, the asan job in the same ones.
  test:
    name: Functional tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy: &functional-parts
      # Every part runs to the end, whichever fails.
      fail-fast: false
      matrix:
        include:
          - part: no_quorum
            tests: test/no_quorum_request.yaml
          - part: safe_quorum
            tests: test/safe_quorum_request.yaml
          - part: each_safe_quorum
            tests: test/each_safe_quorum_request.yaml
          - part: tls and seeds
            tests: test/tls_test.py test/seed_test.py
    container: zcalusic/debian-trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make \
            openssl redis-server python3 python3-plumbum python3-redis \
            python3-requests python3-yaml

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run functional tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MAKEFLAGS="-j $(nproc)" test/run_tests.sh ${{ matrix.tests }}

  # AddressSanitizer and UndefinedBehaviorSanitizer over the unit and
  # functional tests. Leaks aren't checked: valgrind covers those, and the
  # functional tests kill their nodes. The harness doesn't keep dynomite's
  # stderr, so the reports go to files, checked at the end.
  asan:
    name: Sanitizers (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy: *functional-parts
    container: zcalusic/debian-trixie
    env:
      ASAN_OPTIONS: detect_leaks=0:log_path=/tmp/sanitizer/asan
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:log_path=/tmp/sanitizer/ubsan
      SANITIZER_CFLAGS: -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined
    steps:
      - name: Install dependencies
        run: |
          mkdir -p /tmp/sanitizer
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libyaml-dev make \
            openssl redis-server python3 python3-plumbum python3-redis \
            python3-requests python3-yaml

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure --enable-debug=log CFLAGS="$SANITIZER_CFLAGS"
          # -Werror only here, not for configure's own feature tests.
          make -j "$(nproc)" CFLAGS="$SANITIZER_CFLAGS -Werror"

      - name: Unit tests
        run: make -j "$(nproc)" check VERBOSE=1 CFLAGS="$SANITIZER_CFLAGS -Werror"

      - name: Functional tests
        run: test/run_tests.sh --no-rebuild ${{ matrix.tests }}

      - name: Sanitizer reports
        if: always()
        run: |
          if [ -n "$(ls -A /tmp/sanitizer)" ]; then
            cat /tmp/sanitizer/*
            exit 1
          fi
          echo "no sanitizer reports"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: zcalusic/debian-trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libtool make patch

      - uses: actions/checkout@v7
        with:
          # git describe needs the full history and tags for the version.
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          autoreconf -fvi
          ./configure
          make -j "$(nproc)" install-strip

      - name: Check
        run: |
          dynomite -V
          dynomite -t -c conf/redis_single.yml

  test:
    name: Functional tests
    runs-on: ubuntu-latest
    container: zcalusic/debian-trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            automake gcc git libc6-dev libssl-dev libtool make patch \
            redis-server python3 python3-plumbum python3-redis \
            python3-requests python3-yaml

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run functional tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MAKEFLAGS="-j $(nproc)" test/run_tests.sh
